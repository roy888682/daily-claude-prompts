name: 매일 Claude Code 인기 프롬프트 메일

on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 = 한국시간 03:00
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write           # sent-history.md 커밋용

concurrency:
  group: daily-prompts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: 날짜 계산 (KST)
        id: date
        run: |
          echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          mkdir -p out

      - name: Claude로 메일 본문 생성
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            오늘 날짜(KST)는 ${{ steps.date.outputs.today }} 입니다.
            저장소의 prompts/daily-email.md 파일을 읽고 그 지시를 끝까지 수행하세요.
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(gh api:*),Bash(curl:*),Bash(date:*),Bash(ls:*),Bash(cat:*),Bash(jq:*),Bash(mkdir:*)"

      - name: 생성 결과 확인
        run: |
          for f in out/email.html out/email.txt; do
            if [ ! -s "$f" ]; then
              echo "::error::$f 가 생성되지 않았습니다"
              cat out/skip-reason.txt 2>/dev/null || true
              exit 1
            fi
          done

      - name: Gmail SMTP로 발송
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Claude Code 프롬프트 봇 <${{ secrets.GMAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "[Claude Code 프롬프트] ${{ steps.date.outputs.today }} 오늘의 인기 프롬프트 5선"
          html_body: file://out/email.html
          body: file://out/email.txt
          convert_markdown: false

      - name: 발송 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent-history.md
          git diff --cached --quiet || git commit -m "sent-history: ${{ steps.date.outputs.today }}"
          git push
