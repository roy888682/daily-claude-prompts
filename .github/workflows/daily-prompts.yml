name: 매일 Claude Code 인기 프롬프트 메일

on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 = 한국시간 03:00
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write           # data/sent-log.json 커밋용

concurrency:
  group: daily-prompts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 메일 본문 생성 (프롬프트 모음에서 5개 선택, AI 토큰 없음)
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build_email.py
          echo "subject=$(cat out/subject.txt)" >> "$GITHUB_OUTPUT"
          echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      - name: Gmail SMTP로 발송
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Claude Code 프롬프트 봇 <${{ secrets.GMAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.build.outputs.subject }}
          html_body: file://out/email.html
          body: file://out/email.txt
          convert_markdown: false

      - name: 발송 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent-log.json
          git diff --cached --quiet || git commit -m "sent-history: ${{ steps.build.outputs.today }}"
          git push
